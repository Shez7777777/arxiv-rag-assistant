name: retrieval eval

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dense.txt
      - run: python -m paperrag ingest --max 800
      - run: python -m paperrag eval --retriever bm25 dense hybrid --n 300
